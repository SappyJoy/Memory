services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    container_name: quartz_builder
    volumes:
      - ${CONTENT_PATH:-./content}:/app/content
      - ./public:/app/public
    restart: unless-stopped
    network_mode: "host"
    environment:
      - CHOKIDAR_USEPOLLING=true

  nginx:
    image: nginx:latest
    container_name: quartz_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - builder
