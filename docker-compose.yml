services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    container_name: quartz_builder
    volumes:
      - ${CONTENT_PATH:-./content}:/app/content
      - ./public:/app/public
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -f /app/public/index.html ]"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:latest
    container_name: quartz_nginx
    volumes:
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # COMMENT OUT original
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # USE INIT CONFIG
      - ./public:/usr/share/nginx/html:ro
      - certbot_certs:/etc/letsencrypt:ro # Keep this for later
      - certbot_webroot:/var/www/certbot:ro # Nginx needs to read from here
    ports:
      - "80:80"
      - "443:443" # Port 443 can remain, Nginx just won't listen on it with init config
    restart: unless-stopped
    depends_on:
      builder:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    container_name: quartz_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Command to try and renew certificates every 12 hours.
    # If certificates don't exist, it will try to obtain them.
    # IMPORTANT: For the first run, you might want to run a command to obtain certs explicitly.
    # See notes below.
    command: renew --webroot -w /var/www/certbot --quiet --agree-tos --email stponomarevw@gmail.com --no-eff-email --force-renewal
    # Replace YOUR_EMAIL@example.com with your actual email for Let's Encrypt notifications

volumes:
  certbot_certs:
  certbot_webroot:
  # If your ./public is meant to be persistent and not just built content, consider making it a named volume too
  # public_data:
