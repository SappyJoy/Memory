services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    container_name: quartz_builder
    volumes:
      - ${CONTENT_PATH:-./content}:/app/content
      - ./public:/app/public
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -f /app/public/index.html ]"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:latest
    container_name: quartz_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      builder:
        condition: service_healthy
