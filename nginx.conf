# HTTP Server Block: Redirects to HTTPS and handles Let's Encrypt challenges
server {
    listen 80;
    server_name styopa.xyz www.styopa.xyz;

    # Handle Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot; # Path Certbot uses for challenges
    }

    location / {
        return 301 https://$host$request_uri; # Redirect all other HTTP to HTTPS
    }
}

# HTTPS Server Block
server {
    listen 443 ssl;
    http2 on;
    server_name styopa.xyz www.styopa.xyz;

    # SSL Certificate paths (these will be in the certbot_certs volume)
    ssl_certificate /etc/letsencrypt/live/styopa.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/styopa.xyz/privkey.pem;

    # SSL Configuration - Modern compatibility (from Mozilla SSL Config Generator)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m; # about 40000 sessions
    ssl_session_tickets off;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # Optional: Generate and use custom DH params

    # Add HSTS header (Strict-Transport-Security)
    # Be careful with this: once set, browsers will refuse to connect via HTTP.
    # Test thoroughly before enabling for long durations or including preload.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Your existing root and index
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;

        # Updated Content-Security-Policy Header
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://apis.google.com https://cdnjs.cloudflare.com https://plausible.io; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' blob: https://apis.google.com https://cdnjs.cloudflare.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https://images.example.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss: https://apis.google.com https://other-api-domain.com; frame-ancestors 'self'; object-src 'self'; base-uri 'self'; form-action 'self';" always;

        # Security Headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
    }

    # Serve static assets directly, including PDFs
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|pdf)$ {
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Location block for DVC cache (will be added in Part 2)
    # location /dvc-personal/ {
    #     alias /srv/dvc-storage/; # Host path to your DVC storage
    #     autoindex off; # Or on, if you want to browse it (not recommended for security)
    #     dav_methods GET HEAD OPTIONS; # For read-only DVC access

    #     # Basic Authentication
    #     auth_basic "Restricted DVC Cache";
    #     auth_basic_user_file /etc/nginx/conf.d/.htpasswd_dvc; # We'll create and mount this
    # }
}
