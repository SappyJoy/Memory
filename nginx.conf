server {
    listen 80;
    server_name styopa.xyz www.styopa.xyz;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;

        # Updated Content-Security-Policy Header
        add_header Content-Security-Policy "default-src 'self'; \
            script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://apis.google.com; \
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
            img-src 'self' data: https://images.example.com; \
            font-src 'self' https://fonts.gstatic.com; \
            connect-src 'self' wss: https://apis.google.com https://other-api-domain.com; \
            frame-ancestors 'self'; \
            object-src 'self'; \
            base-uri 'self'; \
            form-action 'self';" always;

        # Security Headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Serve static assets directly, including PDFs
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|pdf)$ {
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

